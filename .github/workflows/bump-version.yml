name: Bump version and release

# Bumps the version, rebuilds dist/, commits and tags on master, creates the
# GitHub Release, then dispatches publish.yml on the new tag.
#
# Everything here uses GITHUB_TOKEN, and events it creates (push, tag,
# release) start no workflows. workflow_dispatch is the exception, so
# publish.yml is dispatched explicitly. It then runs as its own top-level
# workflow, which is the filename npm trusted publishing checks.

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Version increment (ignored when `version` is set)
        type: choice
        options: [patch, minor, major, prerelease]
        default: patch
      version:
        description: Explicit version, e.g. 14.2.0 or 14.2.0-beta.0 (optional)
        type: string
        default: ''
      preid:
        description: Pre-release identifier for `prerelease`
        type: string
        default: beta
      dry-run:
        description: Bump, test and build, but don't push, release or publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - run: npm ci

    - name: Bump version
      id: bump
      env:
        RELEASE_TYPE: ${{ inputs.release-type }}
        VERSION: ${{ inputs.version }}
        PREID: ${{ inputs.preid }}
      run: |
        if [ -n "$VERSION" ]; then
          npm version "${VERSION#v}" --no-git-tag-version
        elif [ "$RELEASE_TYPE" = prerelease ]; then
          npm version prerelease --preid "$PREID" --no-git-tag-version
        else
          npm version "$RELEASE_TYPE" --no-git-tag-version
        fi

        name="$(node -p 'require("./package.json").name')"
        version="$(node -p 'require("./package.json").version')"
        tag="v$version"

        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
          echo "::error::Tag $tag already exists."
          exit 1
        fi
        if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
          echo "::error::$name@$version is already published on npm."
          exit 1
        fi

        if grep -q "^## \[$version\] - Unreleased" CHANGELOG.md; then
          sed -i "s/^## \[$version\] - Unreleased/## [$version] - $(date -u +%Y-%m-%d)/" CHANGELOG.md
        elif ! grep -q "^## \[$version\]" CHANGELOG.md; then
          echo "::warning::CHANGELOG.md has no section for $version."
        fi

        echo "Bumped to $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    # CI is skipped for the bump commit, so test here.
    - name: Test
      run: npm test

    - name: Build dist/
      run: npm run build

    - name: Commit and tag
      env:
        VERSION: ${{ steps.bump.outputs.version }}
        TAG: ${{ steps.bump.outputs.tag }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -f dist/ package.json package-lock.json CHANGELOG.md
        git commit -m "chore: release $VERSION [skip ci]"
        git tag -a "$TAG" -m "$TAG"
        git show --stat HEAD

    - name: Push commit and tag
      if: ${{ !inputs.dry-run }}
      env:
        TAG: ${{ steps.bump.outputs.tag }}
      run: git push --atomic origin HEAD:refs/heads/master "refs/tags/$TAG"

    - name: Create GitHub Release
      if: ${{ !inputs.dry-run }}
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.bump.outputs.version }}
        TAG: ${{ steps.bump.outputs.tag }}
      run: |
        awk -v v="$VERSION" '
          index($0, "## [" v "]") == 1 { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md

        args=(--verify-tag --title "$TAG")
        if [ -s release-notes.md ]; then
          args+=(--notes-file release-notes.md)
        else
          args+=(--generate-notes)
        fi
        case "$VERSION" in *-*) args+=(--prerelease) ;; esac

        gh release create "$TAG" "${args[@]}"

    - name: Dispatch publish.yml
      if: ${{ !inputs.dry-run }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.bump.outputs.tag }}
      run: |
        gh workflow run publish.yml --ref "$TAG"
        echo "Dispatched publish.yml on $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/publish.yml"
